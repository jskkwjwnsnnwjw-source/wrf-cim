name: CIM WRF 3 KM - ECMWF

on:
  schedule:
    - cron: '15 06 * * *'
    - cron: '15 08 * * *'
    - cron: '15 12 * * *'
    - cron: '15 18 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      init_time:
        description: 'Initial time (ISO format)'
        required: false
        default: ''
      test_run:
        description: 'Test run (0-6h only)'
        required: false
        default: 'false'

env:
  MODEL_SOURCE: ecmwf
  DOMAIN: cim
  DATA_BRANCH: cim-wrf3-ecmwf-data
  CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/wrf-cim-container:latest

concurrency:
  group: cim-wrf3-ecmwf-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  process-and-publish:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CONTAINER_IMAGE }}
      options: --workdir /wrf_run
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git credentials
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Determine init time
        id: init_time
        run: |
          if [ -n "${{ github.event.inputs.init_time }}" ]; then
            INIT_TIME="${{ github.event.inputs.init_time }}"
          else
            INIT_TIME=$(date -u -d '4 hours ago' '+%Y-%m-%dT%H:00:00Z')
          fi
          
          HOUR=$(echo $INIT_TIME | cut -d'T' -f2 | cut -d':' -f1)
          ROUND_HOUR=$(printf "%02d" $(( (${HOUR#0} / 6) * 6 )))
          
          DATE_PART=$(echo $INIT_TIME | cut -d'T' -f1)
          ROUNDED_TIME="${DATE_PART}T${ROUND_HOUR}:00:00Z"
          
          echo "init_time=$ROUNDED_TIME" >> $GITHUB_OUTPUT
          echo "[CIM-WRF3] Using init time: $ROUNDED_TIME"
      
      - name: Set forecast hours
        id: forecast_hours
        run: |
          if [ "${{ github.event.inputs.test_run }}" = "true" ]; then
            echo "hours=0,3,6" >> $GITHUB_OUTPUT
          else
            echo "hours=0,3,6,9,12,15,18,21,24,27,30,33,36" >> $GITHUB_OUTPUT
          fi
      
      - name: Download ECMWF data
        run: |
          echo "[CIM-WRF3-ECMWF] Downloading..."
          python3 /wrf_run/scripts/download_ecmwf.py \
            -i "${{ steps.init_time.outputs.init_time }}" \
            -f "${{ steps.forecast_hours.outputs.hours }}" \
            -o /wrf_run/ecmwf_data
      
      - name: Setup WPS and run geogrid
        run: |
          echo "[CIM-WRF3-WPS] Running geogrid..."
          mkdir -p /wrf_run/geogrid_output /wrf_run/metgrid_output
          cp /wrf_run/config/cim/namelist.wps.cim /opt/WPS/namelist.wps
          cd /opt/WPS && ./geogrid.exe
          test -f /wrf_run/geogrid_output/geo_em.d01.nc || exit 1
      
      - name: Run ungrib and metgrid
        run: |
          echo "[CIM-WRF3-WPS] Running ungrib/metgrid..."
          cd /opt/WPS
          ln -sf /wrf_run/ecmwf_data/*.grib2 ./FILE:*
          ./ungrib.exe && ./metgrid.exe
          test -f /wrf_run/metgrid_output/met_em.d01.*.nc || exit 1
      
      - name: Run real.exe
        run: |
          echo "[CIM-WRF3-REAL] Running real..."
          cd /opt/WRFV4/test/em_real
          cp /wrf_run/config/cim/namelist.input.cim namelist.input
          ln -sf /wrf_run/metgrid_output/met_em.d01.*.nc ./
          mpirun -np 4 ./real.exe
          test -f wrfinput_d01 && test -f wrfbdy_d01 || exit 1
      
      - name: Run wrf.exe
        run: |
          echo "[CIM-WRF3-WRF] Running wrf..."
          cd /opt/WRFV4/test/em_real
          mpirun -np 4 ./wrf.exe
          test -f wrfout_d01_* || exit 1
          echo "[CIM-WRF3-WRF] Done"
      
      - name: Post-process
        run: |
          echo "[CIM-WRF3-POST] Generating frames..."
          python3 /wrf_run/scripts/postprocess_cim.py \
            --input /opt/WRFV4/test/em_real/ \
            --output /wrf_run/frames \
            --domain $DOMAIN \
            --model $MODEL_SOURCE \
            --init-time "${{ steps.init_time.outputs.init_time }}" \
            --hours "${{ steps.forecast_hours.outputs.hours }}"
      
      - name: Validate
        run: |
          echo "[CIM-WRF3-VALIDATE] Validating..."
          python3 /wrf_run/scripts/validate_cim_wrf3.py \
            --frames-dir /wrf_run/frames \
            --domain $DOMAIN \
            --model $MODEL_SOURCE
      
      - name: Publish to branch
        run: |
          echo "[CIM-WRF3-PUBLISH] Pushing to ${DATA_BRANCH}..."
          git clone -b ${DATA_BRANCH} https://github.com/${{ github.repository }}.git data_branch
          cd data_branch
          rm -f f*.json.gz metadata.json
          cp /wrf_run/frames/*.json.gz ./
          cp /wrf_run/frames/metadata.json ./
          git add *.json.gz metadata.json
          git commit -m "CIM WRF3 ECMWF ${{ steps.init_time.outputs.init_time }}"
          git push origin ${DATA_BRANCH}
          echo "[CIM-WRF3-PUBLISH] Done"
      
      - name: Summary
        run: |
          echo "## CIM WRF 3 KM ECMWF Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Init: ${{ steps.init_time.outputs.init_time }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${DATA_BRANCH}" >> $GITHUB_STEP_SUMMARY
